name: lit batcher
description: >-
  One pass of lit's batcher. Pins every open PR that carries the ready label and
  passes the required check, groups them into one batch PR, and moves batches
  through the merge queue without waiting. Run it on a schedule and after the
  required check finishes; every pass resumes from refs in the repository.
inputs:
  token:
    description: >-
      Token that can push branches, open PRs and enqueue them. Use a GitHub App
      token: pushes made with the workflow's own GITHUB_TOKEN start no checks.
    required: true
  context:
    description: Required status a PR head must pass to be batched, such as "CI / tests"
    required: true
  label:
    description: Label that marks a PR as ready to land
    default: lit-ready
  branch:
    description: Branch the PRs target
    default: main
  repository:
    description: owner/name of the repository
    default: ${{ github.repository }}
  cache-dir:
    description: Bare Git copy lit reuses between passes (keep it on a persistent runner)
    default: ""
  direct-context:
    description: >-
      Full-suite status that lets a batch land on the branch itself, skipping the merge queue,
      when every PR in it passed that status at its exact head and no two of them (nor the
      branch since a PR was tested) change the same file. Any other batch, or one the branch
      refuses, goes through the merge queue. The token's App must be allowed to bypass the
      branch's rules. Empty always uses the merge queue.
    default: ""
  max-batch:
    description: >-
      Most ready PRs in one batch: a number, or "auto" to size each batch from the recent
      share of PRs that came back red. Empty puts every ready PR in one batch.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LIT_CONTEXT: ${{ inputs.context }}
        LIT_LABEL: ${{ inputs.label }}
        LIT_BRANCH: ${{ inputs.branch }}
        LIT_REPOSITORY: ${{ inputs.repository }}
        LIT_CACHE: ${{ inputs.cache-dir }}
        LIT_MAX_BATCH: ${{ inputs.max-batch }}
        LIT_DIRECT_CONTEXT: ${{ inputs.direct-context }}
      run: |
        set -euo pipefail
        # Give git the token only for this step and only for github.com, never in a config file.
        basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
        echo "::add-mask::$basic"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
        args=(intake "$LIT_REPOSITORY" --branch "$LIT_BRANCH" --context "$LIT_CONTEXT")
        if [[ -n $LIT_MAX_BATCH ]]; then args+=(--max-batch "$LIT_MAX_BATCH"); fi
        if [[ -n $LIT_DIRECT_CONTEXT ]]; then args+=(--direct-context "$LIT_DIRECT_CONTEXT"); fi
        if [[ -n $LIT_CACHE ]]; then args+=(--repo-dir "$LIT_CACHE"); fi
        args+=(tick --label "$LIT_LABEL")
        # GITHUB_ACTION_PATH, not github.action_path: in a container job only the env var
        # gives the path as the container sees it. The guard keeps lit from leaving anything in
        # the runner's actions folder: a container job runs as root, and one root-owned file there
        # stops the runner from cleaning that folder, so every later job on it fails.
        source "$GITHUB_ACTION_PATH/../lib/guard.sh"
        source "$GITHUB_ACTION_PATH/../lib/install.sh"
        lit_install
        "$LIT_BIN" "${args[@]}"
