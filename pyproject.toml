[build-system]
requires = []
build-backend = "lit_build"
backend-path = ["build_backend"]

[project]
name = "concurrent-merge-engine"
version = "0.1.0"
description = "Batch reviewed GitHub changes and validate their combined Git tree"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}

[project.scripts]
concurrent-merge = "concurrent_merge.cli:main"

[tool.lit_build]
package = "concurrent_merge"
package-data = ["ps_nodes.ps1", "ts_decls.mjs", "dotnet/*.cs", "dotnet/*.csproj"]
