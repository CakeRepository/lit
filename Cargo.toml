[package]
name = "lit"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
description = "lit lands many concurrent changes at once: one binary, no runtime to install"
repository = "https://github.com/CakeRepository/lit"
publish = false

[dependencies]
# The GitHub transport uses TLS and the system trust store, including enterprise CAs.
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
# Authors can be extracted using capture groups, lookaround and backreferences.
fancy-regex = "0.20.2"
# UTC timestamps in portable receipts. No timezone database is bundled.
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
encoding_rs = "0.8"
# Ruff parses PEP 701 f-strings and reports byte ranges without a Python runtime.
ruff_python_parser = "=0.0.4"
ruff_python_ast = "=0.0.4"
ruff_text_size = "=0.0.4"
tempfile = "3"
# Use the operating system's random source to sample independent cache audits.
getrandom = "0.4"
# Proof identities include the compressed bytes. Statically link the same
# DEFLATE implementation used by Python so large legacy payloads match too.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib"] }
libz-sys = { version = "1.1.33", default-features = false, features = ["static", "stock-zlib"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
