name: Release
# lit releases itself: when main's VERSION names a version that has no tag yet, this builds lit for
# every platform and publishes the binaries with their SHA-256 sums as that release, tagged at that
# commit. A v* tag pushed by hand still publishes its own release. Run it by hand to build without
# publishing.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_VERSION: "1.97.0"
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag to publish: a pushed v* tag, or main's VERSION when no tag has that name yet.
      # Nothing for a manual run, or when VERSION names a release that already exists.
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == push && "$REF_NAME" == main ]]; then
            version=$(tr -d '[:space:]' < VERSION)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must read vMAJOR.MINOR.PATCH, not '$version'"; exit 1; }
            # Any trouble reading the tags fails the run rather than publishing twice.
            found=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$version")
            if [[ -n "$found" ]]; then
              echo "::notice::$version is already tagged; nothing to release."
            else
              tag="$version"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    # Each target builds on a runner of its own OS, so no cross linker is needed.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, name: lit-linux-amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: lit-linux-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: lit-darwin-amd64 }
          - { os: macos-15, target: aarch64-apple-darwin, name: lit-darwin-arm64 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, name: lit-windows-amd64.exe }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, name: lit-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Pin actions to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner images ship rustup, so no setup action is needed; rustup's own installer covers one that doesn't.
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo test --locked
      - name: Build
        env:
          LIT_VERSION: ${{ needs.plan.outputs.tag || format('dev-{0}', github.sha) }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/lit$ext" "dist/${{ matrix.name }}"
      # The arm64 Windows binary is cross-compiled on the x64 runner.
      - if: matrix.target != 'aarch64-pc-windows-msvc'
        run: ./dist/${{ matrix.name }} version
      - if: startsWith(matrix.target, 'x86_64-unknown-linux')
        name: Root hygiene
        run: scripts/root-hygiene.sh dist/${{ matrix.name }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.name }}
          path: dist/
  publish:
    if: needs.plan.outputs.tag != ''
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: lit-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum lit-* > SHA256SUMS && cat SHA256SUMS)
          # A pushed tag must already exist; a VERSION release tags the commit it was built from.
          where=(--verify-tag); [[ "$REF_TYPE" == tag ]] || where=(--target "$GITHUB_SHA")
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "lit $TAG" "${where[@]}" \
            --notes "One binary per platform. Check a download against SHA256SUMS. All merge, intake and proof commands run natively. Use Git 2.48 or later for repository operations."
