name: Release
# A v* tag builds lit for every platform and publishes the binaries with their
# SHA-256 sums as a GitHub release. Run it by hand to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pin actions to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          set -euo pipefail
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name="lit-$os-$arch"; [ "$os" = windows ] && name="$name.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name" ./cmd/lit
          done
          (cd dist && sha256sum lit-* > SHA256SUMS && cat SHA256SUMS)
          ./dist/lit-linux-amd64 version
      - name: Root hygiene
        run: scripts/root-hygiene.sh dist/lit-linux-amd64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lit
          path: dist/
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: lit
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "lit $TAG" --verify-tag \
            --notes "One binary per platform. Check a download against SHA256SUMS. Commands not yet in Go run on the Python lit inside the binary, so they still need Python 3.12 (#35)."
