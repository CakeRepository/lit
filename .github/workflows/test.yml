name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pin actions to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-24.04 ships Python 3.12, so no setup action is needed.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends strace
      - run: python3 -m unittest discover -s tests -v
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_VERSION: "1.97.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships rustup, so no setup action is needed.
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt \
            --target x86_64-unknown-linux-musl
          rustup default "$RUST_VERSION"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo clippy --release --locked --target x86_64-unknown-linux-musl -- -D warnings
      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/lit "$RUNNER_TEMP/lit-linux-amd64"
          "$RUNNER_TEMP/lit-linux-amd64" version
      # The same end-to-end merge checks the Python suite runs, against the binary.
      - name: End to end with the binary
        run: LIT_BIN="$RUNNER_TEMP/lit-linux-amd64" python3 -B -m unittest discover -s tests -p test_end_to_end.py -v
      - name: Native reader conformance
        run: LIT_BIN="$RUNNER_TEMP/lit-linux-amd64" python3 -B tests/native_readers.py
      - name: Native batch assembly
        run: LIT_BIN="$RUNNER_TEMP/lit-linux-amd64" python3 -B -m unittest discover -s tests -p test_engine.py
      # lit as root in a container must leave nothing the runner cannot remove.
      - name: Root hygiene
        run: scripts/root-hygiene.sh "$RUNNER_TEMP/lit-linux-amd64"
  binary-other-os:
    # The binary's own tests on macOS and Windows, where it ships too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUST_VERSION: "1.97.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --target ${{ matrix.target }} && rustup default "$RUST_VERSION"
        shell: bash
      - run: cargo clippy --release --locked --target ${{ matrix.target }} -- -D warnings
        shell: bash
      - if: matrix.target != 'aarch64-pc-windows-msvc'
        run: cargo test --locked
        shell: bash
  action-hygiene:
    # Runs lit's actions the way FlowRMM's container jobs do: as root, over folders that belong to the
    # runner's user. Fails if lit leaves anything the runner's user couldn't delete, which is what broke
    # every FlowRMM orchestrator runner on Nov 25 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # The image FlowRMM's lit batcher job uses.
      image: mirror.gcr.io/library/python:3.13-trixie@sha256:9ffe84122ce74ebdffe2e0e6b946c9dd95d0bf3463f6eb1006b4dc6fefe36d01
      options: --security-opt=no-new-privileges
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends strace
      - name: Run each action's own step as root over runner-owned copies
        run: python3 -B -m unittest tests.test_action_hygiene -v
      # The same check through GitHub's own composite-action runner: hand the checkout to a non-root user,
      # run both actions as root, then nothing in lit's code folders may belong to anyone else.
      - run: chown -R 1001:1001 "$GITHUB_WORKSPACE"
      - uses: ./actions/cached-run
        with:
          job: hygiene
          run: python3 -c 'import sys; sys.path.insert(0, "."); import concurrent_merge.engine'
          store: ${{ runner.temp }}/lit-store
      - uses: ./actions/batcher
        # No valid token here, so the pass fails at its first GitHub call, after importing lit and creating
        # its Git cache, which is what has to stay cleanable.
        continue-on-error: true
        with:
          token: none
          context: Tests / unit
      - name: Nothing in lit's folders belongs to root
        run: |
          left="$(find "$GITHUB_WORKSPACE/actions" "$GITHUB_WORKSPACE/concurrent_merge" ! -uid 1001 -print)"
          [ -z "$left" ] || { echo "::error::lit left files the runner's user can't remove:"; echo "$left"; exit 1; }
