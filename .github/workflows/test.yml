name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pin actions to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ubuntu-24.04 ships Python 3.12, so no setup action is needed.
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends strace
      - run: python3 -m unittest discover -s tests -v
